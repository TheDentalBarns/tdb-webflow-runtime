<!doctype html><meta charset="utf-8" /><title>Motion fixture</title>
<style>
  html {
    scroll-behavior: auto;
  }
  body {
    margin: 0;
    background: #222;
    color: #f9f2e6;
  }
  section {
    height: 900px;
    position: relative;
  }
  section:nth-child(even) {
    background: #554f45;
  }
  .crop {
    position: sticky;
    top: 0;
    height: 600px;
    overflow: hidden;
  }
  .photo {
    position: absolute;
    inset: -30px 0;
    background: linear-gradient(30deg, #99855d, #eee2ce 45%, #675448);
    transform: translateX(0);
    --tdb-photo-scale: 1.1;
  }
  .photo:nth-child(2) {
    left: 100%;
    right: -100%;
  }
  .photo:nth-child(3) {
    left: 200%;
    right: -200%;
  }
  .shade {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0.4;
  }
  .caption {
    position: absolute;
    top: 200px;
    left: 20px;
    right: 20px;
    font: 24px/1.5 system-ui;
  }
  .caption:nth-of-type(2) {
    top: 300px;
  }
  .caption:nth-of-type(3) {
    top: 400px;
  }
</style>
<main></main>
<script src="/audit.js"></script>
<script>
  const script = document.createElement('script');
  script.src =
    new URLSearchParams(location.search).get('version') === 'baseline'
      ? '/baseline.js'
      : '/candidate.js';
  script.onload = startAudit;
  document.body.append(script);
</script>
