<script data-tdb-vip-appointment-options>
(() => {
  const selector = 'select[name="Treatment-Of-Interest"],select[name="Treatment of Interest"]';
  function update(select) {
    const previous = select.value;
    let assessment = [...select.options].find(o => /^(Fast Track|Signature Assessment)$/.test(o.value));
    if (!assessment) return;
    assessment.textContent = 'Signature Assessment';
    assessment.value = 'Signature Assessment';
    let design = [...select.options].find(o => o.value === 'Smile Design');
    if (!design) design = new Option('Smile Design', 'Smile Design');
    select.insertBefore(design, assessment);
    const unsure = [...select.options].find(o => /not sure|don.t know/i.test(o.textContent));
    if (unsure) select.append(unsure);
    select.value = previous === 'Fast Track' ? 'Signature Assessment' : previous;
  }
  document.querySelectorAll(selector).forEach(update);
  document.addEventListener('focusin', e => { if (e.target.matches?.(selector)) update(e.target); });
})();
</script>
