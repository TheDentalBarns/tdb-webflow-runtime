name: Verify mobile navbar handoff
on:
  push:
    branches: [work/mobile-navbar-handoff-20261014]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect published Webflow motion engine
        run: |
          curl --fail --silent 'https://cdn.prod.website-files.com/677cf86cf9952f978d94d80c/js/webflow.a626469f.c9ffb9570cf579d0.js' -o /tmp/webflow.js
          node -e "const s=require('fs').readFileSync('/tmp/webflow.js','utf8'); for (const q of ['bkwld-tram','keepInherited','config.duration','data-nav-menu-open']) {const i=s.indexOf(q); console.log(q+'\\n'+s.slice(Math.max(0,i-1500),i+4500));}"
