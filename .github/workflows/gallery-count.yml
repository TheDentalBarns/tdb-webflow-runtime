name: Verify gallery count ownership
on:
  push:
    branches: [work/gallery-count-20261014]
    paths: ['src/**', 'tools/runtime-build/targets.cjs', 'tests/gallery-explore-count.test.cjs', '.github/workflows/gallery-count.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/tdb-gallery-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - env:
          NODE_PATH: /tmp/tdb-gallery-tests/node_modules
        run: |
          node tools/runtime-build/build-preservation.cjs dist/tdb-gallery.js
          node --test tests/gallery-explore-count.test.cjs tests/gallery-presentation.test.cjs tests/gallery-shared-behaviour.test.cjs
      - run: |
          git add dist/tdb-gallery.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build verified gallery-owned Explore count'
          git push origin HEAD:${{ github.ref_name }}
