# CSS ownership/pins are independent of this JavaScript consolidation.
# Validate committed artifacts without regenerating or committing CSS on main.
name: Verify existing UI artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/runtime-build/verify-ui.cjs
