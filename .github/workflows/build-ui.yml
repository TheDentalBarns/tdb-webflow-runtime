name: Build UI artifacts

on:
  push:
    branches:
      - main
    paths:
      - 'tools/build-ui.py'
      - 'src/styles/tdb-elfsight-timer.css'
      - 'src/styles/tdb-vimeo-ui.css'
      - 'src/styles/tdb-vimeo-content-ui.css'
      - 'src/styles/tdb-runtime-ui.css'
      - 'src/styles/tdb-deferred-ui.css'
      - 'src/styles/tdb-slider-ui.css'
      - 'src/styles/tdb-slider-focus.css'
      - 'src/styles/tdb-vip-drawer-shared.css'
      - 'src/styles/tdb-vip-drawer-desktop.css'
      - '.github/workflows/build-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build UI artifacts
        run: python tools/build-ui.py

      - name: Validate generated artifacts
        run: |
          test -s src/styles/tdb-ui.css
          test -s dist/tdb-ui.css
          test -s dist/tdb-vip.css
          test -s dist/tdb-slider-ui.css
          test -s dist/tdb-vimeo-content-ui.css
          cmp src/styles/tdb-ui.css dist/tdb-ui.css

      - name: Commit generated artifacts
        run: |
          if [ -z "$(git status --porcelain -- src/styles/tdb-ui.css dist/tdb-ui.css dist/tdb-vip.css dist/tdb-slider-ui.css dist/tdb-vimeo-content-ui.css)" ]; then
            echo 'Generated UI files are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/tdb-ui.css dist/tdb-ui.css dist/tdb-vip.css dist/tdb-slider-ui.css dist/tdb-vimeo-content-ui.css
          git commit -m 'Build UI artifacts'
          git push origin HEAD:main

