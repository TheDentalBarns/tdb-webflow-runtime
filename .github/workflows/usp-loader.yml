name: Verify USP runtime loader
on:
  push:
    branches: [work/usp-loader-20261014]
    paths: ['src/**', 'tools/runtime-build/targets.cjs', 'tests/usp-loader-presence.test.cjs', '.github/workflows/usp-loader.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/tdb-usp-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          curl --fail --silent https://cdn.brevo.com/js/sdk-loader.js -o /tmp/brevo-sdk.js
      - env:
          NODE_PATH: /tmp/tdb-usp-tests/node_modules
          TDB_BREVO_SDK: /tmp/brevo-sdk.js
        run: |
          node tools/runtime-build/build-preservation.cjs dist/tdb-runtime.js dist/tdb-usp-drawer.js
          node --test tests/usp-loader-presence.test.cjs tests/brevo-consent.test.cjs tests/runtime-ownership.test.cjs tests/navbar-handoff.test.cjs
      - name: Verify published immutable artifacts
        run: |
          curl --fail --show-error --location --retry 2 --max-time 30 'https://cdn.jsdelivr.net/gh/TheDentalBarns/tdb-webflow-runtime@2e007c5243f3f3d15e1dec724b38b52a04fa91ca/dist/tdb-runtime.js' -o /tmp/runtime-delivery.js
          cmp dist/tdb-runtime.js /tmp/runtime-delivery.js
          curl --fail --show-error --location --retry 2 --max-time 30 'https://cdn.jsdelivr.net/gh/TheDentalBarns/tdb-webflow-runtime@2e007c5243f3f3d15e1dec724b38b52a04fa91ca/dist/tdb-usp-drawer.js' -o /tmp/usp-delivery.js
          cmp dist/tdb-usp-drawer.js /tmp/usp-delivery.js
      - run: |
          git add dist/tdb-runtime.js dist/tdb-usp-drawer.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build verified USP runtime loader and adapter'
          git push origin HEAD:${{ github.ref_name }}
