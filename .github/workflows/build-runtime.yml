name: Build runtime artifacts

on:
  push:
    branches:
      - main
    paths:
      - 'src/runtime/site-asset-loader.js'
      - 'src/runtime/immediate-runtime-batch.js'
      - '.github/workflows/build-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build minified runtimes
        run: |
          npx --yes terser@5 src/runtime/site-asset-loader.js --compress --mangle --output dist/tdb-footer-runtime.min.js
          npx --yes terser@5 src/runtime/immediate-runtime-batch.js --compress --mangle --output dist/tdb-immediate-runtime-batch.min.js

      - name: Validate artifacts
        run: |
          test -s dist/tdb-footer-runtime.min.js
          test -s dist/tdb-immediate-runtime-batch.min.js

      - name: Commit generated artifacts
        run: |
          if [ -z "$(git status --porcelain -- dist/tdb-footer-runtime.min.js dist/tdb-immediate-runtime-batch.min.js)" ]; then
            echo 'Generated runtime files are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/tdb-footer-runtime.min.js dist/tdb-immediate-runtime-batch.min.js
          git commit -m 'Build runtime artifacts'
          git push origin HEAD:main
