name: Build navigation and footer runtime

on:
  push:
    branches: [main]
    paths:
      - 'src/navbar/**'
      - 'src/banner/announcement.js'
      - 'src/vip-drawer/vip-focus.js'
      - 'src/runtime/deferred-ui.js'
      - 'src/runtime/site-asset-loader.js'
      - 'tools/runtime-build/**'
      - '.github/workflows/build-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned compiler
        run: npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
      - name: Build canonical navigation and footer sources
        run: node tools/runtime-build/build.cjs
      - name: Validate artifacts
        run: |
          node --check dist/tdb-navbar.min.js
          node --check dist/tdb-footer-runtime.min.js
      - name: Commit generated artifacts
        run: |
          if [ -z "$(git status --porcelain -- dist/tdb-navbar.min.js dist/tdb-footer-runtime.min.js)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/tdb-navbar.min.js dist/tdb-footer-runtime.min.js
          git commit -m 'Build navigation and footer runtime'
          git push origin HEAD:main
