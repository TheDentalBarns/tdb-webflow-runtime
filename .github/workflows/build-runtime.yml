name: Verify runtime collection
on:
  pull_request:
    paths: ['src/**', 'dist/**', 'tests/**', 'tools/runtime-build/**', 'config/build-artifacts.json', 'package*.json', '.github/workflows/build-runtime.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run verify
