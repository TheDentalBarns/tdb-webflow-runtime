name: Verify deferred VIP forms
on:
  push:
    branches: [work/vip-form-reliability-20261014]
    paths: ['src/forms/**', 'tests/vip-form-reliability.test.cjs', 'tools/runtime-build/targets.cjs', '.github/workflows/vip-form-reliability.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install existing build and test dependencies
        run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/tdb-form-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Build and test deferred forms
        env:
          NODE_PATH: /tmp/tdb-form-tests/node_modules
        run: |
          node tools/runtime-build/build-preservation.cjs dist/tdb-runtime.js dist/tdb-vip-form.js dist/tdb-forms.min.js
          node --check dist/tdb-runtime.js
          node --check dist/tdb-vip-form.js
          node --test tests/vip-form-reliability.test.cjs tests/vip-form-ownership.test.cjs tests/vip-consent-ownership.test.cjs
      - name: Show remaining form consumers
        run: |
          grep -R -n -E 'TDBVIPInterest|tdb-forms|tdb-vip-form' src --exclude=vip-form.js
      - name: Commit verified builds
        run: |
          git add dist/tdb-runtime.js dist/tdb-vip-form.js dist/tdb-forms.min.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build verified deferred VIP forms'
          git push origin HEAD:${{ github.ref_name }}
