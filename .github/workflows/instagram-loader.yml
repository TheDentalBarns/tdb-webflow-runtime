name: Verify Instagram consent loader
on:
  push:
    branches: [work/instagram-loader-20261014]
    paths: ['src/**', 'tools/runtime-build/targets.cjs', 'tests/instagram*', 'tests/fixtures/instagram*', '.github/workflows/instagram-loader.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/tdb-usp-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - env:
          NODE_PATH: /tmp/tdb-usp-tests/node_modules
        run: |
          node tools/runtime-build/build-preservation.cjs dist/tdb-runtime.js dist/tdb-instagram-native.min.js dist/tdb-gallery.js
          node --test tests/instagram-metadata.test.cjs tests/instagram-lifecycle.test.cjs tests/runtime-ownership.test.cjs tests/navbar-handoff.test.cjs tests/gallery-explore-count.test.cjs tests/gallery-presentation.test.cjs tests/gallery-shared-behaviour.test.cjs
      - run: |
          git add dist/tdb-runtime.js dist/tdb-instagram-native.min.js dist/tdb-gallery.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build verified consent-released Instagram enhancement'
          git push origin HEAD:${{ github.ref_name }}
