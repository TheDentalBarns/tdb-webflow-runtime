name: Build consent and shared UI

on:
  push:
    branches:
      - work/consent-ui-early-20261014
    paths:
      - 'src/consent/**'
      - 'src/styles/tdb-consent-states.css'
      - 'tools/build-ui.py'
      - 'tools/runtime-build/**'
      - '.github/workflows/build-consent-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build and test dependencies
        run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/tdb-consent-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Build and verify
        env:
          TDB_JSDOM: /tmp/tdb-consent-tests/node_modules/jsdom
        run: |
          python tools/build-ui.py --global-only
          node tools/runtime-build/build-preservation.cjs dist/tdb-consent-startup.min.js
          node tools/runtime-build/verify-ui.cjs
          node --check dist/tdb-consent-startup.min.js
          node tests/consent-native.test.cjs
          node -e "const fs=require('fs'),assert=require('assert/strict');assert(!fs.readFileSync('dist/tdb-consent-startup.min.js','utf8').includes('data-tdb-consent-state-css'));assert(fs.readFileSync('dist/tdb-ui.css','utf8').includes('.tdb-consent-root.is-consent-active'))"
      - name: Commit verified artifacts
        run: |
          git add src/styles/tdb-ui.css dist/tdb-ui.css dist/tdb-consent-startup.min.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build consent v4.0.8 and shared UI with consent states'
          git push origin HEAD:${{ github.ref_name }}
