name: Verify Brevo consent runtime
on:
  push:
    branches: [work/brevo-consent-runtime-20261014]
    paths: ['src/brevo/**', 'src/runtime/**', 'tools/runtime-build/targets.cjs', 'tests/brevo-consent.test.cjs', 'tests/runtime-ownership.test.cjs', '.github/workflows/brevo-consent.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/tdb-brevo-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          curl --fail --silent 'https://cdn.brevo.com/js/sdk-loader.js' -o /tmp/brevo-sdk.js
      - env:
          NODE_PATH: /tmp/tdb-brevo-tests/node_modules
          TDB_BREVO_SDK: /tmp/brevo-sdk.js
        run: |
          node tools/runtime-build/build-preservation.cjs dist/tdb-runtime.js
          node --test tests/brevo-consent.test.cjs tests/runtime-ownership.test.cjs tests/navbar-handoff.test.cjs
      - name: Verify immutable runtime delivery
        run: |
          curl --fail --show-error --location --retry 1 --max-time 20 --dump-header /tmp/runtime-headers 'https://cdn.jsdelivr.net/gh/TheDentalBarns/tdb-webflow-runtime@35b0c925c0dbd305982d6391ac785aefe2163dc7/dist/tdb-runtime.js' -o /tmp/runtime-delivery.js
          cat /tmp/runtime-headers
          cmp dist/tdb-runtime.js /tmp/runtime-delivery.js
      - run: |
          git add dist/tdb-runtime.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build verified consent-owned Brevo runtime'
          git push origin HEAD:${{ github.ref_name }}
